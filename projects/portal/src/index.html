<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Portal Supermercado</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Applies the dark theme before the 1st paint (injectTheme only runs after Angular boots):
      without this, dark theme users see a white flash while loading.
      Same key and same rule as core/theme/inject-theme.ts.
    -->
    <script>
      try {
        var theme = localStorage.getItem('supermercado:theme');
        var dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root>
      <!-- Shows from the 1st byte; Angular replaces it with the same HTML from App (app.ts). -->
      <div class="global-loading" role="status">
        <span class="global-loading-spinner" aria-hidden="true"></span>
        <span class="sr-only">Carregando…</span>
      </div>
    </app-root>
  </body>
</html>
