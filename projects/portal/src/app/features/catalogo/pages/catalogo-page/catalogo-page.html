<section class="pagina">
  <header class="titulo-pagina">
    <h1>Catálogo</h1>
    <p>Busca, filtros, ordenação e paginação feitos pela API (GET /catalogo).</p>
  </header>

  <app-list-table
    [source]="fonte"
    [columns]="colunas"
    [filters]="filtros"
    [pageSizeOptions]="opcoesPorPagina"
    searchPlaceholder="Produto ou fornecedor"
    errorTitle="Não foi possível carregar o catálogo"
    emptyMessage="Nenhum item encontrado com esses filtros."
  >
    <!-- Filtros específicos (children): a busca, o "Limpar" e a paginação já vêm prontos. -->
    <app-list-table-options-filter
      class="campo-categoria"
      label="Categoria"
      allLabel="Todas"
      [filter]="filtros.categoria"
      [options]="categorias"
    />
    <app-list-table-boolean-filter label="Só estoque baixo" [filter]="filtros.estoqueBaixo" />

    <ng-template [uiCelula]="coluna.preco" let-preco>
      <span class="valor">{{ preco | currency: 'BRL' }}</span>
    </ng-template>
    <ng-template [uiCelula]="coluna.estoque" let-quantidade let-item="linha">
      <span class="valor">{{ quantidade }}</span>
      @if (estoqueBaixo(item)) {
        <span ui-badge variant="destructive" class="alerta-estoque">Baixo</span>
      }
    </ng-template>
  </app-list-table>
</section>
