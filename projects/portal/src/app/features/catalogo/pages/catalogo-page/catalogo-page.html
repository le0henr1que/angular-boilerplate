<section class="pagina">
  <header class="titulo-pagina">
    <h1>Catálogo</h1>
    <p>Busca, filtros, ordenação e paginação feitos pela API (GET /catalogo).</p>
  </header>

  <app-list-table
    [fonte]="fonte"
    [colunas]="colunas"
    [filtros]="filtros"
    [opcoesPorPagina]="opcoesPorPagina"
    placeholderBusca="Produto ou fornecedor"
    tituloErro="Não foi possível carregar o catálogo"
    mensagemVazia="Nenhum item encontrado com esses filtros."
  >
    <!-- Filtros específicos (children): a busca, o "Limpar" e a paginação já vêm prontos. -->
    <app-list-table-filtro-opcoes
      class="campo-categoria"
      rotulo="Categoria"
      rotuloTodas="Todas"
      [filtro]="filtros.categoria"
      [opcoes]="categorias"
    />
    <app-list-table-filtro-booleano rotulo="Só estoque baixo" [filtro]="filtros.estoqueBaixo" />

    <ng-template [uiCelula]="coluna.preco" let-preco>
      <span class="valor">{{ preco | currency: 'BRL' }}</span>
    </ng-template>
    <ng-template [uiCelula]="coluna.estoque" let-quantidade let-item="linha">
      <span class="valor">{{ quantidade }}</span>
      @if (estoqueBaixo(item)) {
        <span ui-badge variant="destructive" class="alerta-estoque">Baixo</span>
      }
    </ng-template>
  </app-list-table>
</section>
